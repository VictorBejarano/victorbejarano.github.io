<div class="bento-container timeline">
  <div class="glass-card" *ngFor="let exp of experience$ | async">
    <h3>{{ exp.role }} <span *ngIf="exp.isCurrent" class="current-badge">Current</span></h3>
    <h4>{{ exp.companyName }}</h4>
    <p class="dates">{{ exp.startDate }} - {{ exp.endDate || 'Present' }}</p>
    <p>{{ exp.description }}</p>
    <div class="tech-stack" *ngIf="exp.technologiesUsed?.length">
      <span class="tech-badge" *ngFor="let tech of exp.technologiesUsed">{{ tech }}</span>
    </div>
  </div>
</div>
