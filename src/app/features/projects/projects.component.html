<div class="bento-container">
  <div class="glass-card project-card" *ngFor="let project of projects$ | async" (click)="openProject(project)">
    <div class="card-image-wrapper">
       <img *ngIf="project.imageUrl" [src]="project.imageUrl" alt="{{ project.title }}" class="thumbnail" />
    </div>
    <h3>{{ project.title }}</h3>
    <p>{{ project.shortDescription }}</p>
  </div>
</div>
